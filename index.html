<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Regedit iOS - Panel de Aceleración</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 27, 34, 0.8);
            --accent-red: #ff3b30;
            --accent-red-hover: #d70015;
            --accent-blue: #007aff;
            --accent-blue-hover: #0056b3;
            --text-color: #f0f6fc;
            --text-dim: #8b949e;
            --border-color: #30363d;
            --success-color: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.15), transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .badge {
            display: inline-block;
            background: rgba(255, 59, 48, 0.2);
            color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            background: #090d11;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-red);
        }

        .btn {
            width: 100%;
            padding: 14px;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: var(--accent-red);
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: var(--accent-red-hover);
        }

        .btn-blue {
            background: var(--accent-blue);
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }

        .btn-blue:active {
            transform: scale(0.98);
            background: var(--accent-blue-hover);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-red);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-dim);
            min-height: 20px;
        }

        .actions-panel {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SENSITIVITY & REGEDIT iOS</h1>
        <p>Aceleración táctil y optimización por Safari</p>
        <span class="badge">Safe Mode v4.2</span>
    </div>

    <div class="form-group">
        <label for="device">Modelo de iPhone</label>
        <select id="device">
            <option value="iPhone 11 / XR">iPhone 11 / XR</option>
            <option value="iPhone 12 / 12 Pro">iPhone 12 / 12 Pro</option>
            <option value="iPhone 13 / 13 Pro">iPhone 13 / 13 Pro</option>
            <option value="iPhone 14 / 14 Pro">iPhone 14 / 14 Pro</option>
            <option value="iPhone 15 / 15 Pro">iPhone 15 / 15 Pro</option>
            <option value="iPhone 16 / 16 Pro">iPhone 16 / 16 Pro</option>
            <option value="Otro / iPad">Otro Modelo / iPad</option>
        </select>
    </div>

    <button class="btn btn-primary" id="action-btn" onclick="iniciarOptimizacion()">GENERAR CONFIGURACIÓN</button>

    <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="status" id="status-text"></div>

    <div class="actions-panel" id="actions-panel">
        <!-- Enlace para descargar el perfil de accesibilidad -->
        <a href="perfil.mobileconfig" class="btn btn-blue" download>DESCARGAR PERFIL (.mobileconfig)</a>
        
        <!-- Enlace para abrir el juego directamente -->
        <a href="freefire://" class="btn btn-primary">ABRIR FREE FIRE</a>
    </div>

    <p class="footer-note">Nota: Para aplicar el perfil descargado en iOS, ve a Ajustes > Perfiles descargados > Autorizar e Instalar.</p>
</div>

<script>
    function iniciarOptimizacion() {
        const btn = document.getElementById('action-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const actionsPanel = document.getElementById('actions-panel');
        const device = document.getElementById('device').value;

        btn.style.display = 'none';
        progressBar.style.display = 'block';
        actionsPanel.style.display = 'none';

        const pasos = [
            { pct: 25, txt: "Analizando respuesta de pantalla..." },
            { pct: 60, txt: `Generando parámetros para ${device}...` },
            { pct: 100, txt: "¡Perfil listo para instalar!" }
        ];

        let idx = 0;
        const interval = setInterval(() => {
            if (idx < pasos.length) {
                progressFill.style.width = pasos[idx].pct + '%';
                statusText.innerText = pasos[idx].txt;
                idx++;
            } else {
                clearInterval(interval);
                setTimeout(() => {
                    statusText.style.color = '#30d158';
                    statusText.innerText = "✓ Proceso completado con éxito.";
                    actionsPanel.style.display = 'block';
                }, 500);
            }
        }, 800);
    }
</script>

</body>
</html>
