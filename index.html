<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Panel Regedit Multi-OS</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00e5ff; /* Color por defecto (Android) */
            --text-color: #ffffff;
            --text-dim: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 22px;
            color: var(--accent-color);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s;
        }

        header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        /* Selector de Sistema Operativo */
        .os-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .os-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-dim);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .os-btn.active[data-os="android"] {
            background: #00e5ff;
            color: #000;
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .os-btn.active[data-os="ios"] {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        /* Tarjeta de Contenido */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Filas de Interruptores (Switches) */
        .switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .switch-group:last-child {
            border-bottom: none;
        }

        .switch-label {
            display: flex;
            flex-direction: column;
        }

        .switch-title {
            font-size: 14px;
            font-weight: 600;
        }

        .status-badge {
            font-size: 11px;
            font-weight: bold;
            margin-top: 2px;
            color: #ff4d4d; /* Inactivo por defecto */
            transition: color 0.3s;
        }

        .status-badge.active {
            color: var(--accent-color); /* Activo */
        }

        /* Toggle Switch UI */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Deslizador de Porcentaje */
        .control-group {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .control-group span.value {
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        /* Botones Acción */
        .btn-main {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-game {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            background: #ff5500;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
        }

        .btn-main:active, .btn-game:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="panel-title">REGEDIT VIP ANDROID</h1>
            <p>Optimizador de Sensibilidad & Respuesta Táctil</p>
        </header>

        <!-- Selector de Sistema Operativo -->
        <div class="os-selector">
            <button class="os-btn active" data-os="android" onclick="selectOS('android')">🤖 Android</button>
            <button class="os-btn" data-os="ios" onclick="selectOS('ios')">🍎 iOS</button>
        </div>

        <div class="card">
            <!-- Option 1: 120 FPS -->
            <div class="switch-group">
                <div class="switch-label">
                    <span class="switch-title">Modo 120 FPS Max</span>
                    <span id="st-fps" class="status-badge">○ DESACTIVADO</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="chk-fps" onchange="toggleStatus('chk-fps', 'st-fps')">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Option 2: No Recoil -->
            <div class="switch-group">
                <div class="switch-label">
                    <span class="switch-title">Sistema No Recoil</span>
                    <span id="st-recoil" class="status-badge">○ DESACTIVADO</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="chk-recoil" onchange="toggleStatus('chk-recoil', 'st-recoil')">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Option 3: Seguimiento a la Cabeza -->
            <div class="switch-group">
                <div class="switch-label">
                    <span class="switch-title">Seguimiento a la Cabeza (89%)</span>
                    <span id="st-head" class="status-badge">○ DESACTIVADO</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="chk-head" onchange="toggleStatus('chk-head', 'st-head')">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Option 4: Touch Delay -->
            <div class="switch-group">
                <div class="switch-label">
                    <span class="switch-title">Optimizar Respuesta Táctil</span>
                    <span id="st-touch" class="status-badge">○ DESACTIVADO</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="chk-touch" onchange="toggleStatus('chk-touch', 'st-touch')">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <button class="btn-main" id="btn-apply" onclick="guardarConfig()">Aplicar Ajustes</button>
        <button class="btn-game" onclick="abrirFreeFire()">🎮 Abrir Free Fire</button>
    </div>

    <script>
        let currentOS = 'android';

        function selectOS(os) {
            currentOS = os;
            const buttons = document.querySelectorAll('.os-btn');
            const title = document.getElementById('panel-title');
            const root = document.documentElement;

            buttons.forEach(btn => btn.classList.remove('active'));

            if (os === 'android') {
                document.querySelector('[data-os="android"]').classList.add('active');
                title.innerText = "REGEDIT VIP ANDROID";
                root.style.setProperty('--accent-color', '#00e5ff');
            } else {
                document.querySelector('[data-os="ios"]').classList.add('active');
                title.innerText = "REGEDIT VIP IOS";
                root.style.setProperty('--accent-color', '#00ff88');
            }
        }

        function toggleStatus(chkId, statusId) {
            const chk = document.getElementById(chkId);
            const status = document.getElementById(statusId);

            if (chk.checked) {
                status.innerText = "● ACTIVADO";
                status.classList.add('active');
            } else {
                status.innerText = "○ DESACTIVADO";
                status.classList.remove('active');
            }
        }

        function guardarConfig() {
            const fpsActive = document.getElementById('chk-fps').checked ? "Activado" : "Desactivado";
            const recoilActive = document.getElementById('chk-recoil').checked ? "Activado" : "Desactivado";
            const headActive = document.getElementById('chk-head').checked ? "Activado (89%)" : "Desactivado";
            const touchActive = document.getElementById('chk-touch').checked ? "Activado" : "Desactivado";

            alert(`Configuración cargada en [${currentOS.toUpperCase()}]:\n\n` +
                  `• 120 FPS: ${fpsActive}\n` +
                  `• No Recoil: ${recoilActive}\n` +
                  `• Seguimiento Cabeza: ${headActive}\n` +
                  `• Respuesta Táctil: ${touchActive}`);
        }

        function abrirFreeFire() {
            window.location.href = "freefire://";
        }
    </script>
</body>
</html>
