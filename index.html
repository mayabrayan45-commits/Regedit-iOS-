<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEDIT VIP 3.0 - Edition Limited</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-red: #ff003c;
            --accent-gold: #ffd700;
            --text-color: #c5c6c7;
            --bright-text: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .panel-container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 60, 0.3);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }

        .header h1 {
            color: var(--bright-text);
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        .header .subtitle {
            color: var(--accent-gold);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: lowercase;
            margin-top: 4px;
            opacity: 0.9;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-label {
            font-size: 0.75rem;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.1rem;
            color: var(--bright-text);
            font-weight: bold;
            margin-top: 4px;
        }

        .section-title {
            color: var(--accent-red);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .slider-container {
            margin-bottom: 12px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-red);
        }

        .btn-apply {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff003c, #990024);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
            transition: transform 0.2s;
        }

        .btn-apply:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="panel-container">
    <div class="header">
        <h1>REGEDIT VIP 3.0</h1>
        <div class="subtitle">edition limited</div>
    </div>

    <!-- Status Métricas -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">Estado RAM</div>
            <div class="metric-value" id="ram-usage">1.8 GB Libres</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Temperatura</div>
            <div class="metric-value" id="temp-val">34.2 °C</div>
        </div>
    </div>

    <!-- Ajustes Android -->
    <div class="section-title">
        <span>🤖</span> Configuración Android
    </div>

    <div class="control-group">
        <div class="slider-container">
            <div class="slider-header">
                <span>Sensibilidad General</span>
                <span id="sens-val">100%</span>
            </div>
            <input type="range" id="sens-slider" min="0" max="200" value="100" oninput="document.getElementById('sens-val').innerText = this.value + '%'">
        </div>

        <div class="slider-container">
            <div class="slider-header">
                <span>Estabilización de Puntería</span>
                <span>99%</span>
            </div>
            <input type="range" min="0" max="100" value="99" disabled>
        </div>

        <div class="slider-container">
            <div class="slider-header">
                <span>Seguimiento a la Cabeza</span>
                <span>58%</span>
            </div>
            <input type="range" min="0" max="100" value="58" disabled>
        </div>
    </div>

    <button class="btn-apply" onclick="alert('Configuración REGEDIT VIP 3.0 aplicada correctamente.')">Aplicar Cambios</button>
</div>

</body>
</html>
