<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Regedit VIP Android</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00e5ff; /* Tono neón para Android */
            --text-color: #ffffff;
            --text-dim: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 22px;
            color: var(--accent-color);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        /* Navegación por pestañas */
        .tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        /* Contenido de las secciones */
        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .tab-content.active {
            display: block;
        }

        /* Controles y Deslizadores */
        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .control-group span {
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        /* Interruptores (Switches) */
        .switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .switch-group:last-child {
            border-bottom: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Botones */
        .btn-main {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .btn-game {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            background: #ff5500;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
        }

        .btn-main:active, .btn-game:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Panel Regedit VIP</h1>
            <p>Optimizador Táctil para Android</p>
        </header>

        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('sensi')">Sensi</button>
            <button class="tab-btn" onclick="openTab('vip')">Ajustes VIP</button>
            <button class="tab-btn" onclick="openTab('info')">Info</button>
        </div>

        <!-- Sección 1: Sensibilidad General -->
        <div id="sensi" class="tab-content active">
            <div class="control-group">
                <label>General <span><span id="v1">96</span>%</span></label>
                <input type="range" min="0" max="100" value="96" oninput="document.getElementById('v1').innerText = this.value">
            </div>

            <div class="control-group">
                <label>Mira Roja <span><span id="v2">98</span>%</span></label>
                <input type="range" min="0" max="100" value="98" oninput="document.getElementById('v2').innerText = this.value">
            </div>

            <div class="control-group">
                <label>Mira 2X <span><span id="v3">90</span>%</span></label>
                <input type="range" min="0" max="100" value="90" oninput="document.getElementById('v3').innerText = this.value">
            </div>

            <div class="control-group">
                <label>Mira 4X <span><span id="v4">95</span>%</span></label>
                <input type="range" min="0" max="100" value="95" oninput="document.getElementById('v4').innerText = this.value">
            </div>
        </div>

        <!-- Sección 2: Ajustes VIP (FPS, Estabilizador y Seguimiento) -->
        <div id="vip" class="tab-content">
            <div class="switch-group">
                <span>Modo 120 FPS Max</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="control-group" style="margin-top: 15px;">
                <label>Estabilizador de Mira <span><span id="stab-val">99</span>%</span></label>
                <input type="range" min="0" max="100" value="99" oninput="document.getElementById('stab-val').innerText = this.value">
            </div>

            <div class="control-group">
                <label>Seguimiento a la Cabeza <span><span id="head-val">58</span>%</span></label>
                <input type="range" min="0" max="100" value="58" oninput="document.getElementById('head-val').innerText = this.value">
            </div>

            <div class="switch-group">
                <span>Reducir Delays táctiles</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Sección 3: Info -->
        <div id="info" class="tab-content">
            <p style="font-size: 13px; color: var(--text-dim); line-height: 1.6;">
                Configuración optimizada para respuesta de pantalla táctil en dispositivos Android.
            </p>
            <p style="font-size: 13px; color: var(--text-dim);">
                <strong>Estado:</strong> <span style="color: var(--accent-color);">Activo (120 FPS)</span><br>
                <strong>Sistema:</strong> Android OS<br>
                <strong>Versión:</strong> 3.2 VIP
            </p>
        </div>

        <button class="btn-main" onclick="guardarConfig()">Aplicar Configuración</button>
        <button class="btn-game" onclick="abrirFreeFire()">🎮 Abrir Free Fire</button>
    </div>

    <script>
        function openTab(tabName) {
            let contents = document.querySelectorAll('.tab-content');
            let buttons = document.querySelectorAll('.tab-btn');

            contents.forEach(content => content.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function guardarConfig() {
            alert("¡Ajustes aplicados correctamente!\n- 120 FPS Activo\n- Estabilizador: 99%\n- Seguimiento Cabeza: 58%");
        }

        function abrirFreeFire() {
            window.location.href = "freefire://";
        }
    </script>
</body>
</html>
